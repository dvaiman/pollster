name: Keep Supabase awake

on:
  schedule:
    # Daily at 06:00 UTC — well below Supabase free tier's 7-day inactivity
    # threshold, with margin if a single run is skipped.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/sessions?select=id&limit=1")
          status=$(echo "${response}" | tail -n1)
          body=$(echo "${response}" | sed '$d')
          echo "Response status: ${status}"
          echo "Response body: ${body}"
          if [ "${status}" != "200" ]; then
            echo "::error::Supabase responded with HTTP ${status} — project may be paused. Restore it at https://supabase.com/dashboard"
            exit 1
          fi
          echo "Supabase is awake."
